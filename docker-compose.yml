services:
  tidepool:
    build: .
    container_name: tidepool
    restart: unless-stopped
    env_file: .env
    environment:
      # Posts carry a base64 image of up to 5 MB (about 7 MB encoded); adapter-node's default is 512K.
      BODY_SIZE_LIMIT: 10M
    volumes:
      - ./data:/data
    # No published port: Pangolin's Traefik reaches http://tidepool:3000 over this network.
    networks:
      - pangolin

networks:
  pangolin:
    external: true
